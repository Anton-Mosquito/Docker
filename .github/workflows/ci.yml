name: CI Pipeline

on:
  workflow_call: # Enables reuse by other workflows
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Lint ──────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm install
      - run: npm run lint
        working-directory: apps/frontend

  # ── Job 2: Test ──────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm install
      - run: npm test
        working-directory: apps/frontend
