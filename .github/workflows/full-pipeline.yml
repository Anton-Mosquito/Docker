name: Full CI/CD Pipeline

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      force_build_all:
        description: 'Force build all services (ignore paths-filter)'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'apps/frontend/**'
              - 'packages/shared/**'
              - 'docker/frontend.Dockerfile'
            backend:
              - 'apps/backend/**'
              - 'packages/shared/**'
              - 'docker/backend.Dockerfile'

      - id: set-matrix
        run: |
          FORCE="${{ github.event.inputs.force_build_all }}"
          MATRIX="[]"
          if [[ "${{ steps.filter.outputs.backend }}" == "true" || "$FORCE" == "true" ]]; then
            MATRIX=$(echo $MATRIX | jq -c '. += [{
              "service": "backend",
              "context": ".",
              "dockerfile": "docker/backend.Dockerfile",
              "target": "runtime"
            }]')
          fi
          if [[ "${{ steps.filter.outputs.frontend }}" == "true" || "$FORCE" == "true" ]]; then
            MATRIX=$(echo $MATRIX | jq -c '. += [{
              "service": "frontend",
              "context": ".",
              "dockerfile": "docker/frontend.Dockerfile",
              "target": "prod"
            }]')
          fi
          FINAL=$(jq -c -n --argjson inc "$MATRIX" '{include: $inc}')
          echo "matrix=$FINAL" >> $GITHUB_OUTPUT

  # 1. Lint & Test (reusable workflow)
  ci:
    needs: changes
    uses: ./.github/workflows/ci.yml

  # 2. Docker Build, Scan & Push
  docker-build:
    needs: [ci, changes]
    if: fromJSON(needs.changes.outputs.matrix).include[0] != null
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/my-fullstack-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Build image for scanning
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}`
          build-args: |
            ${{ matrix.service == 'frontend' && format('VITE_API_URL={0}', vars.VITE_API_URL) || '' }}
          load: true  # зберегти образ локально для trivy
          tags: local-scan/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # FIX: пінимо версію trivy, @master ламається без попередження
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local-scan/${{ matrix.service }}:latest
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"          # падаємо якщо є CRITICAL/HIGH
          ignore-unfixed: true    # ігноруємо вразливості без патчів
          vuln-type: os,library
          severity: CRITICAL,HIGH

      # Завантажуємо результати у вкладку Security → Code scanning
      # Потребує GitHub Advanced Security (є у public repos безкоштовно)
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.service }}

      # Публікуємо мультиплатформений образ з правильними тегами
      - name: Build and push multi-platform image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          platforms: linux/amd64,linux/arm64
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: |
            ${{ matrix.service == 'frontend' && format('VITE_API_URL={0}', vars.VITE_API_URL) || '' }}
          push: true
          # FIX: використовуємо meta.outputs.tags (не хардкодимо :latest)
          tags: ${{ steps.meta.outputs.tags }}
          # FIX: передаємо OCI-мітки (автор, версія, репо, коміт)
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          # Генерує SBOM і provenance — для supply chain безпеки
          sbom: true
          provenance: true

  # 3. Auto-deploy на Staging при кожному пуші в main
  deploy-staging:
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/my-fullstack
            export IMAGE_TAG=sha-${{ github.sha }}
            docker compose pull
            docker compose up -d --no-build
            docker image prune -f 
  # ── 3. Deploy на Production тільки при release (не на кожен main-коміт)
  deploy-prod:
    needs: docker-build
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Копіюємо compose файл на VM щоразу — так VM завжди має актуальну версію
      - name: Copy compose file to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: docker-compose.vm.yml
          target: /opt/my-fullstack/
          strip_components: 0

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e  # зупиняємось при будь-якій помилці
            cd /opt/my-fullstack

            # Перейменовуємо якщо треба
            [ -f docker-compose.vm.yml ] && mv docker-compose.vm.yml docker-compose.yml

            # Встановлюємо тег: для release — версія, для main — sha
            if [[ "${{ github.event_name }}" == "release" ]]; then
              export IMAGE_TAG="${{ github.ref_name }}"
            else
              export IMAGE_TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
            fi

            echo "▶ Deploying IMAGE_TAG=$IMAGE_TAG"

            # Оновлюємо тег у .env
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/" .env

            # Тягнемо нові образи (не зупиняємо сервіс до їх завантаження)
            docker compose pull

            # Піднімаємо з zero-downtime (compose зупиняє → стартує по одному)
            docker compose up -d --remove-orphans

            # Чекаємо 10с і перевіряємо що все живе
            sleep 10
            docker compose ps

            # Прибираємо старі образи (звільняємо місце на диску)
            docker image prune -f

            echo "✅ Deploy завершено"

      - name: Summary
        run: |
          echo "## 🚀 Deployed!" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ vars.PROD_URL }}" >> $GITHUB_STEP_SUMMARY