name: Full CI/CD Pipeline

on:
  push:
    branches: [main]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io

jobs:
  # 1. CI (Lint & Test via Reusable Workflow)
  ci:
    uses: ./.github/workflows/ci.yml

  # 2. Docker Build, Scan & Push
  docker-build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            target: runtime
            build-args: ""
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            target: prod
            build-args: "VITE_API_URL=http://backend:5000"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/my-fullstack-${{ matrix.service }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build local image for scanning
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build-args }}
          load: true
          tags: local-build-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "local-build-${{ matrix.service }}:latest"
          format: "sarif"
          output: "trivy-results.sarif"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always() # Upload even if vulnerabilities are found
        with:
          sarif_file: "trivy-results.sarif"

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}

  # 3. Deploy to Staging (Auto)
  deploy-staging:
    needs: docker-build
    environment: staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Staging
        run: |
          echo "Deploying to staging..."
          echo "Deploy URL: ${{ secrets.DEPLOY_URL }}"
          # curl -X POST ${{ secrets.DEPLOY_TOKEN }}

  # 4. Deploy to Production (Manual Approve)
  deploy-prod:
    needs: deploy-staging
    environment: production
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Production
        run: |
          echo "🚀 Deploying to prod..."
          echo "Deploy URL: ${{ secrets.DEPLOY_URL }}"
          # curl -X POST ${{ secrets.DEPLOY_TOKEN }}
