services:
  frontend:
    image: frontend:dev
    build:
      target: dev
    env_file:
      - .env
    ports: ["3000:3000"]
    volumes:
      - ./frontend/src:/app/src
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true

  backend:
    image: backend:dev
    env_file:
      - .env
    ports:
      - "${BACKEND_HOST_PORT:-5001}:${BACKEND_PORT:-5000}"
      - "9229:9229" # debug port!
    environment:
      - PORT=${BACKEND_PORT:-5000}
    volumes:
      - ./backend:/app # hot reload for backend
      - /app/node_modules

  mailhog: # only in dev!
    image: mailhog/mailhog:latest
    ports: ["8025:8025"]
    profiles:
      - dev

  portainer-ce:
    image: portainer/portainer-ce:latest
    init: true
    ports:
      - "9003:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer_data:/data
    restart: unless-stopped
    profiles:
      - dev
