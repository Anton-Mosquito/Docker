# docker-compose.override.yml
# Automatically merged by Docker Compose for local development.
# Usage: docker compose up --build
#        docker compose --profile debug up --build   ← + redis-commander

services:
  frontend:
    image: frontend:dev
    build:
      target: dev
    env_file:
      - .env
    ports: ["3000:3000"]
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./apps/frontend/src:/app/apps/frontend/src
      - /app/node_modules

  backend:
    image: backend:dev
    env_file:
      - .env
    ports:
      - "${BACKEND_HOST_PORT:-5001}:${PORT:-5000}"
      - "9229:9229" # Node.js debug port
    environment:
      - PORT=${PORT:-5000}
    volumes:
      - ./apps/backend:/app/apps/backend
      # ↓ Workspace root node_modules (from Docker image, has all hoisted deps)
      - /app/node_modules
      - /app/apps/backend/node_modules

  # ── Profile: debug ────────────────────────────────────────────────────────
  # Lightweight Redis UI — useful when debugging queues/cache in dev.
  # Start with: docker compose --profile debug up
  # Or:         npm run compose:debug
  redis-commander:
    image: rediscommander/redis-commander:latest
    profiles: ["debug"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports: ["8081:8081"]
    networks: [backend-net]
    restart: unless-stopped