# production overrides
services:
  nginx:
    # image: ghcr.io/anton-mosquito/nginx:${VERSION:-latest}
    image: nginx:alpine
    ports: ["80:80", "443:443"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5" # макс 50% одного ядра
          memory: 128M # макс 128MB RAM
        reservations:
          cpus: "0.1" # гарантовано 10%
          memory: 64M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    environment:
      - NODE_ENV=production
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx # nginx потребує кешу
      - /var/run # nginx.pid
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  backend:
    environment:
      - PORT=${PORT:-5000}
      - NODE_ENV=production
    read_only: true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" } # Специфічний override для бекенду
    tmpfs:
      - /tmp # Node.js іноді пише у /tmp
    security_opt:
      - no-new-privileges:true # заборона підвищення прав

  db:
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G