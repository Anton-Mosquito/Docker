# /opt/my-fullstack/docker-compose.yml

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  db:
    <<: *common
    image: postgres:15-alpine
    env_file: [.env]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend-net]

  backend:
    <<: *common
    image: ghcr.io/${GHCR_OWNER}/my-fullstack-backend:${IMAGE_TAG:-main}
    env_file: [.env]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [backend-net, frontend-net]

  frontend:
    <<: *common
    image: ghcr.io/${GHCR_OWNER}/my-fullstack-frontend:${IMAGE_TAG:-main}
    # Не публікуємо порт назовні — nginx-proxy проксує всередині мережі
    expose: ["8080"]
    depends_on:
      backend:
        condition: service_healthy
    networks: [frontend-net]

  # ── Reverse proxy: приймає 80/443, роздає SSL ──────────────────────────────
  nginx-proxy:
    <<: *common
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - frontend
    networks: [frontend-net]

  # ── Certbot: отримує і оновлює сертифікати ─────────────────────────────────
  certbot:
    image: certbot/certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    # Перевіряє оновлення кожні 12 годин (Let's Encrypt оновлює за 30 днів до закінчення)
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'"

volumes:
  postgres-data:
  certbot-www:
  certbot-certs:

networks:
  frontend-net:
  backend-net:
